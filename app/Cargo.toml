[package]
name = "rustinho"
description = "Rustinho: sistema da loja de autopeças (interface em Qt)"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
rustinho-nucleo = { path = "../nucleo" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1.0.154"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
winresource = "0.1"
