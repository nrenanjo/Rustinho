[package]
name = "rustinho-nucleo"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11.0"
getrandom = "0.3"
roxmltree = "0.21.1"
rusqlite = { version = "0.40", features = ["backup", "bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
unicode-normalization = "0.1.25"
x25519-dalek = { version = "2", features = ["static_secrets"] }
uuid = { version = "1.28.0", features = ["v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rars = { version = "0.11", default-features = false }
rxing = { version = "0.9", default-features = false, features = ["decoders", "oned", "qrcode", "encoding_rs"] }

[dev-dependencies]
rxing = { version = "0.9", default-features = false, features = ["decoders", "oned", "qrcode", "encoding_rs", "encoders"] }
