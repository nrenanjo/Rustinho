# Monta o app de Android (APK) a cada envio para a "main".
# Se der erro, o fim do registro aparece como aviso ("annotation") da execução.

name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

# Só ler, de fábrica; cada tarefa pede o que precisa.
permissions:
  contents: read

env:
  QT_VERSAO: "6.8.3"
  CARGO_TERM_COLOR: never

jobs:
  apk:
    # Dois APKs: o de 64 bits (celulares mais novos) e o de 32 bits
    # (celulares de entrada, como a linha "Go", que rodam o Android em 32 bits).
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: "64bits"
            qt: android_arm64_v8a
            rust: aarch64-linux-android
            sufixo: ""
          - nome: "32bits"
            qt: android_armv7
            rust: armv7-linux-androideabi
            sufixo: "-32bits"
    name: apk (${{ matrix.nome }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.rust }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Qt (computador e Android)
        run: |
          set -o pipefail
          (
            pip install --quiet aqtinstall &&
            aqt install-qt linux desktop "$QT_VERSAO" linux_gcc_64 -O "$RUNNER_TEMP/qt" &&
            aqt install-qt linux android "$QT_VERSAO" ${{ matrix.qt }} -m qtmultimedia -O "$RUNNER_TEMP/qt" &&
            chmod +x "$RUNNER_TEMP/qt/$QT_VERSAO/${{ matrix.qt }}/bin/"* &&
            ls "$RUNNER_TEMP/qt/$QT_VERSAO"
          ) 2>&1 | tee -a registro.txt
      - name: NDK
        run: |
          NDK_VER=26.1.10909125
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> $GITHUB_ENV
          sudo apt-get install -y ninja-build > /dev/null 2>&1 || true
      - name: Versão
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          IFS=. read A B C <<< "$V"
          echo "VERSAO=$V" >> $GITHUB_ENV
          echo "CODIGO=$((A*10000 + B*100 + C))" >> $GITHUB_ENV
          sed -i "s/^project(Rustinho VERSION [0-9.]*/project(Rustinho VERSION $V/" android/CMakeLists.txt
      # Com a chave da loja (segredos do GitHub), o APK pode ir para Releases.
      # Sem ela, o APK é assinado com uma chave de uso único, só para testar,
      # e nunca é publicado (um APK assim não atualiza o app instalado).
      - name: Assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_CHAVE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          mkdir -p saida
          if [ -n "$CHAVE" ] && [ -n "$SENHA" ]; then
            echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/rustinho.jks"
            echo "::add-mask::$SENHA"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$SENHA" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$SENHA" >> $GITHUB_ENV
            echo "loja" > saida/assinatura.txt
            echo "::notice title=Assinatura::APK assinado com a chave da loja."
          else
            SENHA=$(openssl rand -hex 16)
            echo "::add-mask::$SENHA"
            keytool -genkeypair -keystore "$RUNNER_TEMP/rustinho.jks" -alias rustinho -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Rustinho teste" > /dev/null 2>&1
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$SENHA" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$SENHA" >> $GITHUB_ENV
            echo "teste" > saida/assinatura.txt
            echo "::warning title=Assinatura::Sem a chave da loja (segredos ANDROID_CHAVE_BASE64 e ANDROID_CHAVE_SENHA): APK só para teste, não vai para Releases."
          fi
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rustinho.jks" >> $GITHUB_ENV
          echo "QT_ANDROID_KEYSTORE_ALIAS=rustinho" >> $GITHUB_ENV
      - name: Compilar o APK
        env:
          # 32 bits: o compilador do C++ da ponte precisa saber que é ARMv7.
          CFLAGS_armv7_linux_androideabi: "-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp"
          CXXFLAGS_armv7_linux_androideabi: "-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp"
        run: |
          QT_ANDROID="$RUNNER_TEMP/qt/$QT_VERSAO/${{ matrix.qt }}"
          QT_HOST="$RUNNER_TEMP/qt/$QT_VERSAO/gcc_64"
          set -o pipefail
          (
            "$QT_ANDROID/bin/qt-cmake" -S android -B build-android -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_HOST_PATH="$QT_HOST" \
              -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
              -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
              -DQT_ANDROID_SIGN_APK=ON \
              -DRUSTINHO_QMAKE="$QT_ANDROID/bin/qmake" \
              -DRUSTINHO_VERSAO_CODIGO=$CODIGO &&
            cmake --build build-android --target apk
          ) 2>&1 | tee -a registro.txt
      - name: Mostrar o erro
        if: failure()
        run: |
          touch registro.txt
          {
            echo "--- pastas do Qt"; ls -la "$RUNNER_TEMP/qt/$QT_VERSAO/" || true
            echo "--- bin"; ls -la "$RUNNER_TEMP/qt/$QT_VERSAO/${{ matrix.qt }}/bin" | head -30 || true
            echo "--- qt-cmake"; head -5 "$RUNNER_TEMP/qt/$QT_VERSAO/${{ matrix.qt }}/bin/qt-cmake" || true
          } > pastas.txt 2>&1
          python3 -c "t=open('pastas.txt').read()[-6000:].replace('%','%25').replace('\n','%0A');print('::error title=pastas::'+t)"
          grep -n -i -E "error|erro|failed|fatal|undefined" registro.txt | tail -40 > erros.txt || true
          tail -80 registro.txt > fim.txt
          python3 - <<'PY'
          import re
          def anotar(titulo, arquivo):
              t = open(arquivo, errors="replace").read()[-6000:]
              t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={titulo}::{t}")
          anotar("linhas com erro", "erros.txt")
          anotar("fim do registro", "fim.txt")
          PY
      - name: Juntar o APK
        run: |
          mkdir -p saida
          APK=$(find build-android -name "*.apk" | grep -v unsigned | head -1)
          [ -z "$APK" ] && APK=$(find build-android -name "*.apk" | head -1)
          echo "APK: $APK"
          cp "$APK" "saida/Rustinho-$VERSAO-Android${{ matrix.sufixo }}.apk"
          ls -la saida
      # Confere no próprio APK quem assinou (C-10): o certificado do APK tem
      # de ser o da chave usada, e nunca o da chave antiga, que era pública.
      - name: Conferir a assinatura
        run: |
          set -eu
          ASSINADOR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner
          APK=$(ls saida/*.apk)
          "$ASSINADOR" verify --print-certs "$APK" > certs.txt
          DO_APK=$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}' | tr 'a-f' 'A-F')
          DA_CHAVE=$(keytool -list -v -keystore "$RUNNER_TEMP/rustinho.jks" -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" -alias rustinho \
                       | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':')
          ANTIGA=F00729D099BFBBC2C1F74AB560F580CC708E16F028BF32C39F293AEEC983223A
          echo "Certificado do APK: $DO_APK"
          [ -n "$DO_APK" ] && [ "$DO_APK" = "$DA_CHAVE" ] || { echo "::error title=Assinatura::o certificado do APK não é o da chave usada"; exit 1; }
          [ "$DO_APK" != "$ANTIGA" ] || { echo "::error title=Assinatura::APK assinado com a chave antiga (pública)"; exit 1; }
          echo "$DO_APK" > saida/certificado.txt
          sha256sum "$APK" | awk '{print $1}' > saida/arquivo.txt
          echo "| APK | certificado (SHA-256) | arquivo (SHA-256) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $(basename "$APK") ($(cat saida/assinatura.txt)) | $DO_APK | $(cat saida/arquivo.txt) |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rustinho-Android${{ matrix.sufixo }}
          path: saida/
          retention-days: 30

  # A versão nova é publicada pela montagem do Windows e do Linux
  # (montar.yml); aqui os APKs entram nela, uma vez só, e só se foram
  # assinados com a chave da loja.
  publicar:
    # Só a "main" publica; em outro ramo os arquivos ficam nos artefatos.
    if: github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Rustinho-Android*
          path: baixados
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          # Impressão digital (SHA-256) do certificado da loja, guardada em
          # Settings → Secrets and variables → Actions → Variables. Opcional:
          # com ela, um APK de outra chave nunca é publicado.
          ESPERADA: ${{ vars.ANDROID_CHAVE_IMPRESSAO }}
        run: |
          set -eu
          VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG="v$VERSAO"
          ANTIGA=F00729D099BFBBC2C1F74AB560F580CC708E16F028BF32C39F293AEEC983223A
          ASSINADOR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner
          impressao() { "$ASSINADOR" verify --print-certs "$1" | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F'; }
          ESPERADA=$(echo "${ESPERADA:-}" | tr -d ': ' | tr 'a-f' 'A-F')
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            for i in $(seq 1 50); do
              gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
              sleep 60
            done
          fi
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice title=APK pronto::Sem a versão $TAG em Releases; os APKs ficaram só nos artefatos."
            exit 0
          fi
          JA=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for pasta in baixados/*/; do
            APK=$(ls "$pasta"*.apk)
            NOME=$(basename "$APK")
            CERT=$(impressao "$APK")
            # Nunca publica APK de teste, da chave antiga ou de chave diferente da esperada.
            if [ "$(cat "$pasta/assinatura.txt")" != "loja" ]; then
              echo "::error title=APK não publicado::$NOME foi assinado só para teste. Cadastre os segredos ANDROID_CHAVE_BASE64 e ANDROID_CHAVE_SENHA no GitHub (veja android/assinatura/LEIA.md) e rode de novo."
              exit 1
            fi
            if [ "$CERT" = "$ANTIGA" ] || { [ -n "$ESPERADA" ] && [ "$CERT" != "$ESPERADA" ]; }; then
              echo "::error title=APK não publicado::$NOME tem o certificado $CERT, que não é o da loja."
              exit 1
            fi
            # Já está na versão: confere o que está lá antes de deixar como está.
            if echo "$JA" | grep -qx "$NOME"; then
              rm -rf ja && mkdir ja
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$NOME" -D ja
              LA=$(impressao "ja/$NOME")
              if [ "$LA" != "$CERT" ]; then
                echo "::error title=APK publicado com outra chave::$NOME em $TAG tem o certificado $LA (este é $CERT). Apague esse arquivo da versão e rode de novo."
                exit 1
              fi
              echo "::notice title=APK pronto::$TAG já tem $NOME, com o mesmo certificado."
              continue
            fi
            gh release upload "$TAG" "$APK" -R "$GITHUB_REPOSITORY"
            echo "::notice title=APK publicado::$NOME em $TAG (certificado $CERT)"
          done

  # Abre o APK num Android de mentira (emulador) e tira fotos da tela.
  # As fotos e o registro vão para o ramo "testes-android" (64 bits) e
  # "testes-android-32bits" (32 bits, desenho pela CPU; teste mais curto).
  testar:
    needs: apk
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: "64bits"
            sufixo: ""
            curto: ""
          - nome: "32bits"
            sufixo: "-32bits"
            curto: "1"
    name: testar (${{ matrix.nome }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Só lê: as fotos vão como artefato e outro passo as guarda no ramo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Rustinho-Android${{ matrix.sufixo }}
          path: saida
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          CURTO: ${{ matrix.curto }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash android/testar.sh
      - name: Guardar as fotos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fotos${{ matrix.sufixo }}
          path: fotos/
          retention-days: 14
          if-no-files-found: ignore
      - name: Avisos do registro
        if: always()
        run: |
          [ -f fotos/erros.txt ] || exit 0
          python3 - <<'PY'
          t = open("fotos/erros.txt", errors="replace").read()[-6000:] or "nenhum"
          t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::warning title=registro do app::{t}")
          PY

  # Guarda as fotos nos ramos testes-android e testes-android-32bits (para
  # ver no celular). Separado do teste: só este passo pode gravar.
  fotos:
    needs: testar
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        sufixo: ["", "-32bits"]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: fotos${{ matrix.sufixo }}
          path: fotos
      - name: Guardar no ramo
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d fotos ] || exit 0
          mkdir -p r && cp -r fotos r/ && cd r
          git init -q -b testes-android${{ matrix.sufixo }}
          git config user.name "montagem" && git config user.email "montagem@users.noreply.github.com"
          git add -A && git commit -qm "Fotos do teste ${GITHUB_SHA::7}" || exit 0
          # A chave vai no cabeçalho, não no endereço (não aparece em registro nenhum).
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push -q -f "https://github.com/${{ github.repository }}.git" testes-android${{ matrix.sufixo }}
