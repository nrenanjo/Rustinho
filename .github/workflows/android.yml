# Monta o app de Android (APK) a cada envio para a "main".
# Se der erro, o fim do registro aparece como aviso ("annotation") da execução.

name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSAO: "6.8.3"
  CARGO_TERM_COLOR: never

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Qt (computador e Android)
        run: |
          set -o pipefail
          (
            pip install --quiet aqtinstall &&
            aqt install-qt linux desktop "$QT_VERSAO" linux_gcc_64 -O "$RUNNER_TEMP/qt" &&
            aqt install-qt linux android "$QT_VERSAO" android_arm64_v8a -m qtmultimedia -O "$RUNNER_TEMP/qt" &&
            ls "$RUNNER_TEMP/qt/$QT_VERSAO"
          ) 2>&1 | tee -a registro.txt
      - name: NDK
        run: |
          NDK_VER=26.1.10909125
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> $GITHUB_ENV
          sudo apt-get install -y ninja-build > /dev/null 2>&1 || true
      - name: Versão
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          IFS=. read A B C <<< "$V"
          echo "VERSAO=$V" >> $GITHUB_ENV
          echo "CODIGO=$((A*10000 + B*100 + C))" >> $GITHUB_ENV
          sed -i "s/^project(Rustinho VERSION [0-9.]*/project(Rustinho VERSION $V/" android/CMakeLists.txt
      - name: Assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_CHAVE_BASE64 }}
          SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/rustinho.jks"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$SENHA" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$SENHA" >> $GITHUB_ENV
          else
            cp android/assinatura/rustinho.jks "$RUNNER_TEMP/rustinho.jks"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=rustinho" >> $GITHUB_ENV
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=rustinho" >> $GITHUB_ENV
          fi
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rustinho.jks" >> $GITHUB_ENV
          echo "QT_ANDROID_KEYSTORE_ALIAS=rustinho" >> $GITHUB_ENV
      - name: Compilar o APK
        run: |
          QT_ANDROID="$RUNNER_TEMP/qt/$QT_VERSAO/android_arm64_v8a"
          QT_HOST="$RUNNER_TEMP/qt/$QT_VERSAO/gcc_64"
          set -o pipefail
          (
            "$QT_ANDROID/bin/qt-cmake" -S android -B build-android -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DQT_HOST_PATH="$QT_HOST" \
              -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
              -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
              -DQT_ANDROID_SIGN_APK=ON \
              -DRUSTINHO_QMAKE="$QT_ANDROID/bin/qmake" \
              -DRUSTINHO_VERSAO_CODIGO=$CODIGO &&
            cmake --build build-android --target apk
          ) 2>&1 | tee -a registro.txt
      - name: Mostrar o erro
        if: failure()
        run: |
          touch registro.txt
          grep -n -i -E "error|erro|failed|fatal|undefined" registro.txt | tail -40 > erros.txt || true
          tail -80 registro.txt > fim.txt
          python3 - <<'PY'
          import re
          def anotar(titulo, arquivo):
              t = open(arquivo, errors="replace").read()[-6000:]
              t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={titulo}::{t}")
          anotar("linhas com erro", "erros.txt")
          anotar("fim do registro", "fim.txt")
          PY
      - name: Juntar o APK
        run: |
          mkdir -p saida
          APK=$(find build-android -name "*.apk" | grep -v unsigned | head -1)
          [ -z "$APK" ] && APK=$(find build-android -name "*.apk" | head -1)
          echo "APK: $APK"
          cp "$APK" "saida/Rustinho-$VERSAO-Android.apk"
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: Rustinho-Android
          path: saida/*.apk
          retention-days: 30
      - name: Publicar em Releases (versão nova ou já publicada)
        run: |
          echo "::notice title=APK pronto::$(ls saida)"

  # Abre o APK num Android de mentira (emulador) e tira fotos da tela.
  # As fotos e o registro vão para o ramo "testes-android".
  testar:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rustinho-Android
          path: saida
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash android/testar.sh
      - name: Guardar as fotos no ramo testes-android
        if: always()
        run: |
          mkdir -p /tmp/r && cp -r fotos /tmp/r/ 2>/dev/null || true
          cd /tmp/r && git init -q -b testes-android
          git config user.name "montagem" && git config user.email "montagem@users.noreply.github.com"
          git add -A && git commit -qm "Fotos do teste ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" testes-android
      - name: Avisos do registro
        if: always()
        run: |
          [ -f fotos/erros.txt ] || exit 0
          python3 - <<'PY'
          t = open("fotos/erros.txt", errors="replace").read()[-6000:] or "nenhum"
          t = t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::warning title=registro do app::{t}")
          PY
