# SÓ PARA TESTE: monta, do mesmo commit, o Rustinho portátil para Windows
# 10/11 (64 bits, ZIP) e o AppImage do Linux (x86-64), confere os dois e
# roda os testes do núcleo no Linux e no Windows. Com "[rascunho]" na
# mensagem do commit, prepara um RASCUNHO de versão (não publicado, só o
# dono vê) com os dois arquivos; publicar é outro passo, feito à parte.
name: Montar teste (Windows portátil e Linux AppImage)

on:
  push:
    # FALHA-07 (auditoria da 0.9.15): a branch da 0.9.15. O nome segue a
    # convenção das anteriores (build-0.9.x) e precisa ser confirmado; a
    # da 0.9.14 continua.
    branches: [build-0.9.14, build-0.9.15, teste/c8-portatil]
  # Também à mão (aba Actions › "Run workflow"), sem precisar de push.
  workflow_dispatch:

permissions:
  contents: read

# Versões fixas de tudo o que a montagem usa (os arquivos baixados têm o
# SHA-256 conferido).
env:
  QT_VERSAO: "6.8.3"
  RCLONE_VERSAO: "v1.68.2"
  CARGO_TERM_COLOR: always

jobs:
  testes:
    runs-on: ubuntu-24.04
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Formatação
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p rustinho-nucleo --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Testes do núcleo
        shell: bash
        run: |
          set -o pipefail
          cargo test -p rustinho-nucleo 2>&1 | tee testes-linux.txt
      - name: Resumo dos testes (avisos)
        id: resumo
        if: always()
        run: python3 .github/scripts/resumir_testes.py testes-linux.txt "Linux"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Testes-Linux
          path: testes-linux.txt
          retention-days: 30

  # Os testes do núcleo também no Windows (não seguram o ZIP: o resultado
  # vai no artefato "Testes-Windows").
  testes-windows:
    runs-on: windows-2022
    outputs:
      resumo: ${{ steps.resumo.outputs.resumo }}
      falhas: ${{ steps.resumo.outputs.falhas }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: Testes do núcleo (Windows)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p rustinho-nucleo --no-fail-fast 2>&1 | tee testes-windows.txt
      - name: Resumo dos testes (avisos)
        id: resumo
        if: always()
        shell: bash
        run: python .github/scripts/resumir_testes.py testes-windows.txt "Windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Testes-Windows
          path: testes-windows.txt
          retention-days: 30

  portatil:
    needs: testes
    runs-on: windows-2022
    outputs:
      nome: ${{ steps.zip.outputs.nome }}
      sha: ${{ steps.zip.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSAO }}
          arch: win64_msvc2022_64
          cache: true
      - name: Versão
        shell: bash
        run: echo "VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> $GITHUB_ENV
      - name: Compilar
        shell: bash
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake.exe"
          cargo build --release -p rustinho
      - name: Juntar os arquivos (Qt, rclone, runtime)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Falha nesta etapa::$($_.Exception.Message) (linha $($_.InvocationInfo.ScriptLineNumber))"; break }
          $nome = "Rustinho-$env:VERSAO-Windows-portatil"
          $p = "saida\$nome"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target\release\rustinho.exe $p\
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir app\qml --qmldir app\base --no-translations --no-system-d3d-compiler --no-opengl-sw $p\rustinho.exe
          foreach ($dll in "msvcp140.dll","msvcp140_1.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $p\ -ErrorAction SilentlyContinue
          }
          Invoke-WebRequest "https://github.com/rclone/rclone/releases/download/$env:RCLONE_VERSAO/rclone-$env:RCLONE_VERSAO-windows-amd64.zip" -OutFile rclone.zip
          $hash = (Get-FileHash rclone.zip -Algorithm SHA256).Hash
          if ($hash -ne "812BF76CC02C04CF6327F3683F3D5A88E47D36C39DB84C1A745777496BE7D993") { throw "rclone.zip diferente do esperado: $hash" }
          Expand-Archive rclone.zip -DestinationPath rclone-tmp
          Copy-Item (Get-ChildItem rclone-tmp -Recurse -Filter rclone.exe | Select-Object -First 1).FullName $p\
          # A marca do modo portátil e as instruções (texto do Windows: UTF-8 com BOM e CRLF).
          $utf8 = New-Object System.Text.UTF8Encoding $true
          foreach ($f in "rustinho-portatil.txt","LEIA-ME.txt") {
            $t = (Get-Content -Raw -Encoding UTF8 "instalador\portatil\$f") -replace "`r?`n", "`r`n"
            [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $p) $f), $t, $utf8)
          }
          $t = (Get-Content -Raw -Encoding UTF8 LICENSE) -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $p) "LICENCA.txt"), $t, $utf8)
          $t = (Get-Content -Raw -Encoding UTF8 docs\ROTEIRO-linux-completo.md) -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $p) "ROTEIRO-DE-TESTE.txt"), $t, $utf8)
          New-Item -ItemType Directory -Force "$p\dados" | Out-Null
          echo "PASTA=$p" >> $env:GITHUB_ENV
          echo "NOME=$nome" >> $env:GITHUB_ENV
          Get-ChildItem $p | Select-Object Name, Length | Format-Table
      # Abre uma CÓPIA do portátil sem tela (offscreen) e confere: os dados
      # ficam em "dados" dentro dela, e nada aparece na pasta do Rustinho
      # instalado (%LOCALAPPDATA%\Rustinho) nem na de RUSTINHO_DADOS.
      - name: Conferir o isolamento (abre uma cópia)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Falha nesta etapa::$($_.Exception.Message) (linha $($_.InvocationInfo.ScriptLineNumber))"; break }
          $copia = "conferir\$env:NOME"
          New-Item -ItemType Directory -Force conferir | Out-Null
          Copy-Item -Recurse $env:PASTA $copia
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" "$copia\platforms\"
          $instalado = Join-Path $env:LOCALAPPDATA "Rustinho"
          $outra = Join-Path $env:RUNNER_TEMP "rustinho-dados-env"
          if (Test-Path $instalado) { throw "A pasta do Rustinho instalado já existia no robô: $instalado" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:RUSTINHO_DADOS = $outra
          $proc = Start-Process -FilePath "$copia\rustinho.exe" -WorkingDirectory $copia -PassThru
          $banco = "$copia\dados\rustinho.db"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $banco); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          $vivo = -not $proc.HasExited
          if ($vivo) { Stop-Process -Id $proc.Id -Force }
          Get-ChildItem -Recurse "$copia\dados" | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path $banco)) { throw "O portátil não criou o banco em dados\ (o programa abriu? $vivo)" }
          if (Test-Path $instalado) { throw "O portátil criou dados na pasta do Rustinho instalado: $instalado" }
          if (Test-Path $outra) { throw "O portátil usou RUSTINHO_DADOS: $outra" }
          if (Test-Path "$env:PASTA\dados\rustinho.db") { throw "A pasta que vai no ZIP ganhou um banco" }
          "Isolamento conferido: banco em $banco; nada em $instalado nem em $outra." | Tee-Object -FilePath isolamento.txt
          $lista = (Get-ChildItem -Recurse "$copia\dados" | ForEach-Object { $_.FullName.Substring((Resolve-Path $copia).Path.Length) }) -join "%0A"
          Write-Output "::notice title=Isolamento do portátil::Banco criado em dados\ da cópia; nada em LOCALAPPDATA\Rustinho nem em RUSTINHO_DADOS. Arquivos em dados:%0A$lista"
      - name: ZIP e SHA-256
        id: zip
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Falha nesta etapa::$($_.Exception.Message) (linha $($_.InvocationInfo.ScriptLineNumber))"; break }
          $zip = "saida\$env:NOME.zip"
          Compress-Archive -Path $env:PASTA -DestinationPath $zip -CompressionLevel Optimal
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $env:NOME.zip" | Out-File -Encoding ascii "saida\$env:NOME.zip.sha256"
          Copy-Item isolamento.txt saida\
          Get-Content "saida\$env:NOME.zip.sha256"
          Get-ChildItem saida -File | Select-Object Name, Length | Format-Table
          $tam = (Get-Item $zip).Length
          "nome=$env:NOME.zip" >> $env:GITHUB_OUTPUT
          "sha=$h" >> $env:GITHUB_OUTPUT
          Write-Output "::notice title=ZIP portátil::$env:NOME.zip%0ASHA-256: $h%0ATamanho: $tam bytes%0ACommit: $env:GITHUB_SHA"
          # O que vai dentro do ZIP (para conferir sem baixar).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $topo = $z.Entries | ForEach-Object { ($_.FullName -split '/')[1] } | Where-Object { $_ } | Sort-Object -Unique
          $n = $z.Entries.Count
          $z.Dispose()
          $raiz = ($topo -join ', ')
          Write-Output "::notice title=Conteúdo do ZIP::$n arquivos. Na pasta: $raiz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rustinho-Windows-portatil
          path: |
            saida/*.zip
            saida/*.sha256
            saida/isolamento.txt
          retention-days: 30

  # AppImage normal do Linux (o mesmo da montagem de sempre), com conferência.
  linux:
    needs: testes
    runs-on: ubuntu-22.04
    outputs:
      nome: ${{ steps.appimage.outputs.nome }}
      sha: ${{ steps.appimage.outputs.sha }}
      conferencia: ${{ steps.conferir.outputs.conferencia }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.0"
      - name: Bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libfuse2 file xvfb
      - name: Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSAO }}
          arch: linux_gcc_64
          cache: true
      - name: Versão
        run: echo "VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> $GITHUB_ENV
      - name: Compilar
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build --release -p rustinho
      - name: AppImage
        id: appimage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp target/release/rustinho AppDir/usr/bin/
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/$RCLONE_VERSAO/rclone-$RCLONE_VERSAO-linux-amd64.zip"
          echo "0e6fa18051e67fc600d803a2dcb10ddedb092247fc6eee61be97f64ec080a13c  rclone.zip" | sha256sum -c -
          unzip -q -j rclone.zip '*/rclone' -d AppDir/usr/bin/
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          printf '%s  %s\n' \
            c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d linuxdeploy \
            15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724 linuxdeploy-plugin-qt | sha256sum -c -
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export QML_SOURCES_PATHS="$PWD/app/qml:$PWD/app/base"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          export OUTPUT="Rustinho-$VERSAO-Linux-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir \
            --desktop-file instalador/rustinho.desktop \
            $(for n in 16 22 24 32 48 64 128 256 512; do printf -- '--icon-file instalador/icones/hicolor/%sx%s/apps/rustinho.png ' "$n" "$n"; done) \
            --icon-filename rustinho \
            --plugin qt --output appimage
          mkdir -p saida && mv Rustinho-*.AppImage saida/
          h=$(sha256sum "saida/$OUTPUT" | cut -d' ' -f1)
          echo "$h  $OUTPUT" > "saida/$OUTPUT.sha256"
          echo "nome=$OUTPUT" >> $GITHUB_OUTPUT
          echo "sha=$h" >> $GITHUB_OUTPUT
          echo "::notice title=AppImage::$OUTPUT%0ASHA-256: $h%0ATamanho: $(stat -c %s saida/$OUTPUT) bytes%0ACommit: $GITHUB_SHA"
      # Confere o arquivo pronto: (1) nenhuma biblioteca faltando dentro
      # dele; (2) abre numa tela virtual, carrega as telas e cria o banco
      # (pasta de dados de teste, HOME de mentira).
      - name: Conferir o AppImage (dependências e abrir)
        id: conferir
        shell: bash
        run: |
          set -uo pipefail
          A="$PWD/saida/${{ steps.appimage.outputs.nome }}"
          chmod +x "$A"
          mkdir -p conferir && cd conferir
          "$A" --appimage-extract >/dev/null
          r=squashfs-root
          falta=$(find "$r/usr" -type f \( -name '*.so*' -o -path '*/usr/bin/rustinho' \) -print0 \
                  | xargs -0 -n1 ldd 2>/dev/null | grep "not found" | sort -u || true)
          libs=$(find "$r/usr/lib" -maxdepth 1 -name '*.so*' | wc -l)
          plataformas=$(ls "$r/usr/plugins/platforms" 2>/dev/null | tr '\n' ' ')
          qml=$(ls "$r/usr/qml" 2>/dev/null | tr '\n' ' ')
          xcbcursor=$(ls "$r/usr/lib" | grep -c "libxcb-cursor" || true)
          echo "::notice title=AppImage por dentro::$libs bibliotecas em usr/lib; plataformas: $plataformas; módulos QML: $qml; libxcb-cursor junto: $xcbcursor"
          if [ -n "$falta" ]; then echo "::error title=Bibliotecas faltando::$(echo "$falta" | tr '\n' ';')"; exit 1; fi
          cd ..
          export HOME="$RUNNER_TEMP/casa"; mkdir -p "$HOME"
          export RUSTINHO_DADOS="$RUNNER_TEMP/dados-teste"
          export QT_QUICK_BACKEND=software
          fechar_arvore() { for c in $(pgrep -P "$1"); do fechar_arvore "$c"; done; kill -TERM "$1" 2>/dev/null || true; }
          abrir() {
            rm -rf "$RUSTINHO_DADOS"
            xvfb-run -a -s "-screen 0 1280x800x24" "$A" > abrir.log 2>&1 &
            pid=$!
            for i in $(seq 1 60); do [ -f "$RUSTINHO_DADOS/rustinho.db" ] && break; kill -0 $pid 2>/dev/null || break; sleep 1; done
            sleep 8
            if kill -0 $pid 2>/dev/null; then vivo=sim; else vivo=nao; fi
            fechar_arvore $pid
            sleep 3
          }
          modo="com FUSE (como no computador)"
          abrir
          if [ ! -f "$RUSTINHO_DADOS/rustinho.db" ] && grep -qi "fuse" abrir.log; then
            cat abrir.log
            modo="sem FUSE no robô (APPIMAGE_EXTRACT_AND_RUN)"
            export APPIMAGE_EXTRACT_AND_RUN=1
            abrir
          fi
          problemas=$(grep -iE "failed to load component|is not installed|cannot load library|could not load the qt platform|segmentation|abort" abrir.log | head -5 | tr '\n' ';' || true)
          echo "--- registro ao abrir ---"; cat abrir.log | head -60
          if [ ! -f "$RUSTINHO_DADOS/rustinho.db" ]; then echo "::error title=AppImage não abriu::não criou o banco em RUSTINHO_DADOS; $problemas"; exit 1; fi
          if [ -n "$problemas" ]; then echo "::error title=AppImage com problema ao abrir::$problemas"; exit 1; fi
          if [ -e "$HOME/.local/share/rustinho" ]; then echo "::error title=AppImage::usou a pasta de sempre com RUSTINHO_DADOS"; exit 1; fi
          if [ "$vivo" != sim ]; then echo "::error title=AppImage fechou sozinho::$problemas"; exit 1; fi
          msg="sem biblioteca faltando dentro do arquivo ($libs bibliotecas junto; plataforma $plataformas); aberto $modo numa tela virtual (X), carregou as telas, criou o banco na pasta de RUSTINHO_DADOS e continuava aberto depois de 8 s"
          echo "conferencia=$msg" >> $GITHUB_OUTPUT
          echo "::notice title=AppImage aberto::$msg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rustinho-Linux
          path: |
            saida/*.AppImage
            saida/*.sha256
          retention-days: 30

  # RASCUNHO da versão (não publicado: só o dono do repositório vê). Os dois
  # arquivos são os mesmos que as tarefas acima montaram e conferiram.
  rascunho:
    needs: [testes, testes-windows, portatil, linux]
    if: always() && needs.testes.result == 'success' && needs.portatil.result == 'success' && needs.linux.result == 'success' && contains(github.event.head_commit.message, '[rascunho]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Rustinho-*
          path: saida
          merge-multiple: true
      - name: Conferir os arquivos e escrever as notas
        shell: bash
        env:
          ZIP: ${{ needs.portatil.outputs.nome }}
          SHA_ZIP: ${{ needs.portatil.outputs.sha }}
          APPIMAGE: ${{ needs.linux.outputs.nome }}
          SHA_APPIMAGE: ${{ needs.linux.outputs.sha }}
          TESTES_LINUX: ${{ needs.testes.outputs.resumo }}
          TESTES_WINDOWS: ${{ needs.testes-windows.outputs.resumo || 'não terminaram' }}
          FALHAS_WINDOWS: ${{ needs.testes-windows.outputs.falhas || 'sem resultado' }}
          CONFERENCIA_LINUX: ${{ needs.linux.outputs.conferencia }}
        run: |
          set -euo pipefail
          ls -la saida
          echo "$SHA_ZIP  saida/$ZIP" | sha256sum -c -
          echo "$SHA_APPIMAGE  saida/$APPIMAGE" | sha256sum -c -
          echo "VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> $GITHUB_ENV
          python3 - <<'PY'
          import os
          t = open("instalador/portatil/NOTAS-DA-VERSAO.md", encoding="utf-8").read()
          for k in ["ZIP", "SHA_ZIP", "APPIMAGE", "SHA_APPIMAGE", "TESTES_LINUX", "TESTES_WINDOWS", "FALHAS_WINDOWS", "CONFERENCIA_LINUX"]:
              t = t.replace("{{" + k + "}}", os.environ[k])
          t = t.replace("{{COMMIT}}", os.environ["GITHUB_SHA"])
          assert "{{" not in t, t
          open("notas.md", "w", encoding="utf-8").write(t)
          PY
          echo "::notice title=Rascunho::notas prontas para v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
      - name: Rascunho da versão (não publicado)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: Rustinho ${{ env.VERSAO }} — versão de TESTE (não estável)
          body_path: notas.md
          draft: true
          prerelease: true
          make_latest: false
          files: |
            saida/${{ needs.portatil.outputs.nome }}
            saida/${{ needs.linux.outputs.nome }}
