# Parte em Rust do app de Android: a mesma ponte e as mesmas telas do
# computador (app/), como biblioteca estática para o CMake do Qt for Android.
[package]
name = "rustinho_android"
# A mesma versão do Cargo.toml da raiz (AUD33-I06): a CI recusa o APK se
# forem diferentes. Ao mudar a versão da raiz, mude aqui também.
version = "0.9.18-dev.3.2"
edition = "2021"
authors = ["Renan Galvão"]
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
rustinho-nucleo = { path = "../../nucleo" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1.0.154"

[build-dependencies]
cxx-qt-build = "0.10"
winresource = "0.1"

[profile.release]
strip = true
# Conta que passaria do tamanho do número para a operação (vira erro e nada
# é gravado) em vez de "dar a volta" em silêncio.
overflow-checks = true

# Fora do workspace do computador.
[workspace]
